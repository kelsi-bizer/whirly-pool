<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<title>Whirly Pool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one full-screen canvas pool; HUD floats over it, clear of the safe areas. Single deliberate look. */
  :root {
    --deck: #e9e4d8;      /* pool coping stone */
    --deck-shade: #d6cfbf;
    --ink: #0d3b5c;       /* deep pool navy */
    --water: #7fd0f0;
    --foam: #ffffff;
    --coral: #ff6b4a;     /* ball + button */
    --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--deck); color: var(--ink);
    font-family: var(--body); touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  #safe > div { width: 100%; height: 100%; }
  .hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 4;
    padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    pointer-events: none;
  }
  .brand { font-family: var(--display); font-size: 24px; letter-spacing: .02em; color: var(--ink); }
  .timer { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums;
    background: rgba(13,59,92,.08); padding: 4px 10px; border-radius: 999px; }
  .hud-right { display: flex; align-items: center; gap: 8px; }
  .level { font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: #fff; background: var(--ink); padding: 6px 10px; border-radius: 999px; }
  /* the level badge is a real dropdown: a see-through native select laid over the badge */
  .level-pick { position: relative; pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .level-pick::after { content: ""; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #fff; }
  .level-pick select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
  .level-pick:focus-within { outline: 3px solid var(--coral); outline-offset: 2px; }
  .card { grid-template-columns: minmax(0, 1fr); }
  .start-level { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; color: var(--ink); white-space: nowrap; min-width: 0; }
  .start-level select {
    font: 800 16px var(--body); color: var(--ink); background: #eef6fa; border: 2px solid rgba(13,59,92,.18);
    border-radius: 12px; padding: 8px 10px; flex: 1; min-width: 0; width: 100%;
  }
  .start-level select:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .banner {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 2;
    transform: translateX(-50%); max-width: calc(100% - 32px); box-sizing: border-box; text-align: center;
    background: #fbfaf6; color: var(--ink); border-radius: 999px; padding: 10px 18px;
    font-weight: 800; font-size: 15px; box-shadow: 0 8px 20px rgba(13,59,92,.22);
    pointer-events: none; animation: bannerIn 2.8s ease forwards;
  }
  .banner b { font-family: var(--display); font-weight: 400; color: var(--coral); margin-right: 6px; }
  @keyframes bannerIn { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .banner { animation-duration: 3.5s; } }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; text-align: center;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(13,59,92,.6); pointer-events: none;
  }
  .overlay {
    position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(13,59,92,.18);
  }
  .card {
    width: min(320px, 100%); box-sizing: border-box; text-align: center;
    background: #fbfaf6; color: var(--ink); border-radius: 22px; padding: 26px 22px 22px;
    box-shadow: 0 18px 40px rgba(13,59,92,.28); display: grid; gap: 12px;
  }
  .card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; text-wrap: balance; }
  .card p { margin: 0; font-size: 15px; line-height: 1.45; color: #3c6680; }
  .card .big { font-family: var(--display); font-size: 46px; color: var(--coral); font-variant-numeric: tabular-nums; line-height: 1; }
  button {
    font: 800 17px var(--body); color: #fff; background: var(--coral); border: 0;
    border-radius: 999px; padding: 14px 22px; margin-top: 4px; cursor: pointer;
    box-shadow: 0 4px 0 #d94b2c;
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #d94b2c; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .small { font-size: 12px !important; color: #6a8ea3 !important; }
</style>

<canvas id="c"></canvas>
<div id="safe"><div id="safeInner"></div></div>

<div class="hud">
  <div class="brand">Whirly Pool</div>
  <div class="hud-right">
    <label class="level level-pick"><span id="levelChip">Level 1</span><select id="levelSelect" aria-label="Jump to level"></select></label>
    <div class="timer" id="timer">0.0 s</div>
  </div>
</div>
<div class="hint" id="hint">Tilt to steer</div>
<div class="banner" id="banner" hidden><b id="bannerLevel">Level 2</b><span id="bannerText">Bounce past the rubber ducks</span></div>

<div class="overlay" id="startCard">
  <div class="card">
    <h1>Whirly Pool</h1>
    <p>A ball is about to land in the pool. Tilt your phone to roll it into the whirlpool's drain.</p>
    <label class="start-level" for="startLevel">Start at <select id="startLevel"></select></label>
    <button id="startBtn" type="button">Drop the ball</button>
    <p class="small">Hold the phone the way you like before you tap. That angle counts as level.</p>
  </div>
</div>

<div class="overlay" id="winCard" hidden>
  <div class="card">
    <h1 id="winTitle">Down the drain!</h1>
    <div class="big" id="winTime">0.0 s</div>
    <p id="bestLine">Best: –</p>
    <button id="againBtn" type="button">Go to Level 2</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const timerEl = document.getElementById('timer');
  const hintEl = document.getElementById('hint');
  const startCard = document.getElementById('startCard');
  const winCard = document.getElementById('winCard');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- sizing ----------
  let W = 0, H = 0, DPR = 1, pool = null, CX = 0, CY = 0, R = 0, HOLE = 0;
  const wtex = document.createElement('canvas');
  const wctx = wtex.getContext('2d');
  let img = null, CELL = 4, TW = 0, TH = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const s = document.getElementById('safe');
    const cs = getComputedStyle(s);
    const st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
    const sl = parseFloat(cs.paddingLeft) || 0, sr = parseFloat(cs.paddingRight) || 0;
    const m = 14;
    pool = { x: Math.max(m, sl + 8), y: st + 52, w: 0, h: 0, r: 26 };
    pool.w = W - pool.x - Math.max(m, sr + 8);
    pool.h = H - pool.y - (sb + 38);
    CX = pool.x + pool.w / 2; CY = pool.y + pool.h / 2;
    R = Math.min(pool.w, pool.h) * 0.36;
    HOLE = Math.max(16, R * 0.16);
    TW = Math.ceil(pool.w / CELL); TH = Math.ceil(pool.h / CELL);
    wtex.width = TW; wtex.height = TH;
    img = wctx.createImageData(TW, TH);
    if (ball) clampBall();
  }

  // ---------- input: tilt, drag fallback, keys ----------
  const tilt = { x: 0, y: 0 };         // degrees, after calibration
  let raw = null, base = null, gotOrientation = false, mode = 'tilt';
  const drag = { on: false, ox: 0, oy: 0, x: 0, y: 0 };
  const keys = {};

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    return typeof window.orientation === 'number' ? window.orientation : 0;
  }
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    gotOrientation = true;
    const a = -screenAngle() * Math.PI / 180;
    const x = e.gamma, y = e.beta;
    raw = { x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) };
    if (!base) base = { ...raw };
  }
  async function enableTilt() {
    try {
      const DOE = window.DeviceOrientationEvent;
      if (DOE && typeof DOE.requestPermission === 'function') {
        const res = await Promise.race([DOE.requestPermission(), new Promise(r => setTimeout(() => r('timeout'), 4000))]);
        if (res !== 'granted') return false;
      }
      window.addEventListener('deviceorientation', onOrient);
      return true;
    } catch (_) { return false; }
  }
  function useDragMode() {
    mode = 'drag';
    hintEl.textContent = matchMedia('(pointer: coarse)').matches ? 'Drag your finger to tilt the pool' : 'Drag or use arrow keys to tilt';
  }

  cv.addEventListener('pointerdown', e => { drag.on = true; drag.ox = e.clientX; drag.oy = e.clientY; drag.x = drag.y = 0; });
  addEventListener('pointermove', e => { if (drag.on) { drag.x = e.clientX - drag.ox; drag.y = e.clientY - drag.oy; } });
  addEventListener('pointerup', () => { drag.on = false; drag.x = drag.y = 0; });
  addEventListener('pointercancel', () => { drag.on = false; drag.x = drag.y = 0; });
  addEventListener('keydown', e => { keys[e.key] = true; });
  addEventListener('keyup', e => { keys[e.key] = false; });

  function readTilt() {
    let x = 0, y = 0;
    if (raw && base) { x = raw.x - base.x; y = raw.y - base.y; }
    if (drag.on) { x += drag.x / 3; y += drag.y / 3; }
    if (keys.ArrowLeft) x -= 20; if (keys.ArrowRight) x += 20;
    if (keys.ArrowUp) y -= 20; if (keys.ArrowDown) y += 20;
    const lim = 35;
    x = Math.max(-lim, Math.min(lim, x)); y = Math.max(-lim, Math.min(lim, y));
    tilt.x += (x - tilt.x) * 0.25; tilt.y += (y - tilt.y) * 0.25;
  }

  // ---------- game state ----------
  let ball = null, ripples = [], state = 'idle', t0 = 0, elapsed = 0, level = 1;
  const LAST_LEVEL = 10;
  const FOUNTAIN_COUNT = { 9: 5, 10: 5 }; // levels with pulsing fountains around the whirlpool
  const PILING_COUNT = { 5: 4, 6: 4, 7: 4 }; // levels with wooden pilings around the drain
  // levels with a lane rope: its size (share of the whirlpool radius) and gap width (radians)
  const ROPE = { 3: { size: 0.62, gap: 0.95 }, 6: { size: 0.9, gap: 0.72 } };
  const DUCK_COUNT = { 2: 3, 4: 5, 7: 5, 8: 10, 10: 4 }; // levels with rubber ducks, and how many
  // (the lane-rope level keeps its old storage key from when it was level 2)
  const BEST_KEYS = { 1: 'whirlpool-best', 2: 'whirlpool-best-ducks', 3: 'whirlpool-best-2', 4: 'whirlpool-best-4', 5: 'whirlpool-best-5', 6: 'whirlpool-best-6', 7: 'whirlpool-best-7', 8: 'whirlpool-best-8', 9: 'whirlpool-best-9', 10: 'whirlpool-best-10' };
  const BANNERS = { 2: 'Watch out for flying ducks', 3: 'Find the gap in the lane rope', 4: 'Five ducks this time', 5: 'Steer between the pilings', 6: 'Through the rope, then past the pilings', 7: 'Ducks and pilings', 8: 'Ten ducks!', 9: 'Slip past the fountains while they rest', 10: 'Fountains and ducks' };
  const bests = {};
  for (let lv = 1; lv <= LAST_LEVEL; lv++) {
    bests[lv] = null;
    try { const b = parseFloat(localStorage.getItem(BEST_KEYS[lv])); if (b > 0) bests[lv] = b; } catch (_) {}
  }
  // Level 3 obstacle: a floating lane rope ringed around the whirlpool, with one gap that drifts around.
  const ring = { a: 0, speed: -0.55, gap: 0.95, th: 4.5, cap: 6 };
  const ringR = () => R * (ROPE[level] ? ROPE[level].size : 0.62);

  // Fountains: jets on the pool floor that switch on and off. While spraying they push the ball away.
  let fountains = [], ft = 0;
  const F_PERIOD = 4.5, F_ON = 0.85; // seconds per cycle, share of the cycle spent spraying
  function newFountains(count) {
    const off = Math.random() * Math.PI * 2;
    fountains = Array.from({ length: count }, (_, i) => ({ a: off + i * Math.PI * 2 / count, phase: ((i * 2) % count) / count, seed: Math.random() * 10 }));
  }
  function fountainPos(f) {
    const fr = R * 0.56;
    return { x: CX + Math.cos(f.a) * fr, y: CY + Math.sin(f.a) * fr, reach: Math.max(56, (ball ? ball.r : 14) * 4.7) };
  }
  function fountainPower(f) {
    const c = (ft / F_PERIOD + f.phase) % 1;
    if (c >= F_ON) return 0;
    const ramp = 0.1, x = Math.min(1, c / ramp, (F_ON - c) / ramp);
    return x * x * (3 - 2 * x);
  }

  // Level 5 obstacle: wooden pilings standing in a ring around the drain. They never move.
  let pilings = [];
  function newPilings(count) {
    const off = Math.random() * Math.PI * 2;
    pilings = Array.from({ length: count }, (_, i) => ({ a: off + i * Math.PI * 2 / count, seed: Math.random() * 10 }));
  }
  function pilingPos(pl) {
    const pr = R * 0.4;
    return { x: CX + Math.cos(pl.a) * pr, y: CY + Math.sin(pl.a) * pr, r: Math.max(15, ball ? ball.r * 1.25 : 18) };
  }
  function collidePilings(b) {
    for (const pl of pilings) {
      const p = pilingPos(pl);
      const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy) || 0.001, min = b.r + p.r;
      if (d < min) bounceOff(b, dx / d, dy / d, min, p.x, p.y);
    }
  }

  // Level 2 obstacle: three rubber ducks carried by the current. They circle the whirlpool but never go down it.
  let ducks = [];
  const DUCK_MASS = 1.6; // ball mass = 1
  function newDucks(count) {
    // on piling levels the ducks are a little smaller, so they can squeeze between the posts
    const r = ball.r * (PILING_COUNT[level] ? 1.0 : 1.3), off = Math.random() * Math.PI * 2;
    ducks = Array.from({ length: count }, (_, i) => {
      const a = off + i * Math.PI * 2 / count, d = R * (0.65 + 0.12 * (i % 3));
      return { x: CX + Math.cos(a) * d, y: CY + Math.sin(a) * d, vx: 0, vy: 0, r, dir: a + Math.PI / 2, bobP: i * 2.1, wa: Math.random() * Math.PI * 2, fling: 0 };
    });
  }
  function stepDucks(dt) {
    const drag = Math.exp(-0.8 * dt), maxSp = 280;
    const floor = HOLE * 1.15, pushR = floor + HOLE * 1.25;
    for (const k of ducks) {
      const dx = k.x - CX, dy = k.y - CY, d = Math.hypot(dx, dy) || 0.001, nx = dx / d, ny = dy / d;
      // the current: swirls harder toward the drain and draws ducks in from anywhere in the pool
      const kk = Math.max(0, 1 - d / (R * 1.3));
      const swirl = 360 * kk * kk + 80 * kk;
      const pull = 200 * kk * kk + 60 * kk + 70;
      let ax = -ny * swirl - nx * pull, ay = nx * swirl - ny * pull;
      // each duck wanders with its own slowly turning nudge
      k.wa += (Math.random() - 0.5) * 3 * dt;
      ax += Math.cos(k.wa) * 45; ay += Math.sin(k.wa) * 45;
      // fountains push ducks outward too (a bit less than the ball; ducks are heavier)
      for (const f of fountains) {
        const pw = fountainPower(f); if (!pw) continue;
        const q = fountainPos(f), fx = k.x - q.x, fy = k.y - q.y, fd = Math.hypot(fx, fy) || 0.001;
        if (fd < q.reach + k.r * 0.5) {
          const push = 1100 * pw * Math.max(0, 1 - fd / (q.reach + k.r * 0.5));
          ax += (nx * 0.75 + fx / fd * 0.25) * push; ay += (ny * 0.75 + fy / fd * 0.25) * push;
        }
      }
      // too buoyant to go under: close to the drain the water lifts it back out, smoothly and harder the closer it gets
      if (d < pushR) {
        const q = (pushR - d) / (pushR - floor), push = 1800 * Math.min(1, q) * Math.min(1, q);
        // with pilings around the drain, throw it out through the nearest gap between the posts
        let ox = nx, oy = ny;
        if (pilings.length) {
          const step = Math.PI * 2 / pilings.length, ang = Math.atan2(dy, dx);
          const ga = pilings[0].a + step / 2 + Math.round((ang - pilings[0].a - step / 2) / step) * step;
          ox = Math.cos(ga); oy = Math.sin(ga);
        }
        ax += ox * push; ay += oy * push;
      }
      // once the drain throws a duck out on a piling level, it keeps going until it's clear of the posts
      if (pilings.length) {
        const ringOut = R * 0.4 + pilingPos(pilings[0]).r + k.r + 8;
        if (d < pushR) k.fling = 1.2;
        if (k.fling > 0) {
          k.fling -= dt;
          if (d > ringOut) k.fling = 0;
          const step = Math.PI * 2 / pilings.length, ang = Math.atan2(dy, dx);
          const ga = pilings[0].a + step / 2 + Math.round((ang - pilings[0].a - step / 2) / step) * step;
          ax = Math.cos(ga) * 1000 - ny * swirl * 0.25; ay = Math.sin(ga) * 1000 + nx * swirl * 0.25;
        }
      }
      // between the posts, lean toward the middle of the gap so a duck threads through instead of snagging
      if (pilings.length && d < R * 0.4 + pilingPos(pilings[0]).r + k.r) {
        const step = Math.PI * 2 / pilings.length, ang = Math.atan2(dy, dx);
        const ga = pilings[0].a + step / 2 + Math.round((ang - pilings[0].a - step / 2) / step) * step;
        let off = ang - ga; off = Math.atan2(Math.sin(off), Math.cos(off));
        ax += ny * off * 900; ay += -nx * off * 900;
      }
      if (d < floor) { k.x = CX + nx * floor; k.y = CY + ny * floor; const vr = k.vx * nx + k.vy * ny; if (vr < 0) { k.vx -= vr * nx; k.vy -= vr * ny; } }
      k.vx = (k.vx + ax * dt) * drag; k.vy = (k.vy + ay * dt) * drag;
      // keep them floaty: ease any high speed back down instead of letting it spike
      const spd = Math.hypot(k.vx, k.vy);
      if (spd > maxSp) { const f = 1 - Math.min(1, dt * 4) * (1 - maxSp / spd); k.vx *= f; k.vy *= f; }
      for (const pl of pilings) {
        const q = pilingPos(pl), ex = k.x - q.x, ey = k.y - q.y, ed = Math.hypot(ex, ey) || 0.001, min = k.r + q.r;
        if (ed < min) {
          const ux = ex / ed, uy = ey / ed; k.x = q.x + ux * min; k.y = q.y + uy * min;
          const vn = k.vx * ux + k.vy * uy; if (vn < 0) { k.vx -= 1.3 * vn * ux; k.vy -= 1.3 * vn * uy; }
        }
      }
      k.x += k.vx * dt; k.y += k.vy * dt;
      // pool walls
      const L = pool.x + k.r, Rt = pool.x + pool.w - k.r, T = pool.y + k.r, B = pool.y + pool.h - k.r;
      if (k.x < L) { k.x = L; k.vx = Math.abs(k.vx) * 0.8; }
      if (k.x > Rt) { k.x = Rt; k.vx = -Math.abs(k.vx) * 0.8; }
      if (k.y < T) { k.y = T; k.vy = Math.abs(k.vy) * 0.8; }
      if (k.y > B) { k.y = B; k.vy = -Math.abs(k.vy) * 0.8; }
      // face the way it's drifting
      const sp = Math.hypot(k.vx, k.vy);
      if (sp > 8) {
        let diff = Math.atan2(k.vy, k.vx) - k.dir;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        k.dir += diff * Math.min(1, dt * 4);
      }
    }
    // ducks bump each other
    for (let i = 0; i < ducks.length; i++)
      for (let j = i + 1; j < ducks.length; j++) collide(ducks[i], 1, ducks[j], 1, 0.25);
  }
  // circle-vs-circle bounce with masses; returns impact speed
  function collide(a, ma, b, mb, e) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001, min = a.r + b.r;
    if (d >= min) return 0;
    const nx = dx / d, ny = dy / d, over = min - d, tot = ma + mb;
    a.x -= nx * over * mb / tot; a.y -= ny * over * mb / tot;
    b.x += nx * over * ma / tot; b.y += ny * over * ma / tot;
    const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (vn >= 0) return 0;
    const j = -(1 + e) * vn / (1 / ma + 1 / mb);
    a.vx -= j * nx / ma; a.vy -= j * ny / ma;
    b.vx += j * nx / mb; b.vy += j * ny / mb;
    return -vn;
  }

  function newBall() {
    const br = Math.max(13, Math.min(pool.w, pool.h) * 0.04);
    // land somewhere well outside the whirlpool
    let x, y, tries = 0;
    do {
      x = pool.x + br + 10 + Math.random() * (pool.w - 2 * br - 20);
      y = pool.y + br + 10 + Math.random() * (pool.h - 2 * br - 20);
      tries++;
    } while (Math.hypot(x - CX, y - CY) < R * 1.25 && tries < 60);
    ball = { x, y, vx: 0, vy: 0, r: br, z: 1, spin: 0, sink: 0, sa: 0, sr: 0 };
  }
  function clampBall() {
    const b = ball;
    b.x = Math.max(pool.x + b.r, Math.min(pool.x + pool.w - b.r, b.x));
    b.y = Math.max(pool.y + b.r, Math.min(pool.y + pool.h - b.r, b.y));
  }
  function ripple(x, y, max, life, alpha) { ripples.push({ x, y, max, life, alpha, age: 0 }); }

  function start() {
    startCard.hidden = true; winCard.hidden = true;
    base = raw ? { ...raw } : null;
    newBall(); ripples = [];
    state = 'dropping'; elapsed = 0; t0 = performance.now();
    document.getElementById('levelChip').textContent = 'Level ' + level;
    levelSelectEl.value = String(level);
    const banner = document.getElementById('banner');
    banner.hidden = true;
    clearTimeout(bannerTimer);
    ducks = [];
    if (DUCK_COUNT[level]) newDucks(DUCK_COUNT[level]);
    pilings = [];
    if (PILING_COUNT[level]) newPilings(PILING_COUNT[level]);
    fountains = [];
    if (FOUNTAIN_COUNT[level]) newFountains(FOUNTAIN_COUNT[level]);
    if (ROPE[level]) { ring.a = Math.random() * Math.PI * 2; ring.gap = ROPE[level].gap; }
    if (BANNERS[level]) {
      document.getElementById('bannerLevel').textContent = 'Level ' + level;
      document.getElementById('bannerText').textContent = BANNERS[level];
      void banner.offsetWidth; banner.hidden = false;
      bannerTimer = setTimeout(() => { banner.hidden = true; }, 2800);
    }
  }
  let bannerTimer = 0;

  // level picker: on the start screen, and on the level badge at any time
  const LEVEL_NAMES = { 1: 'Open pool', 2: '3 ducks', 3: 'Lane rope', 4: '5 ducks', 5: 'Pilings', 6: 'Rope + pilings',
    7: 'Ducks + pilings', 8: '10 ducks', 9: 'Fountains', 10: 'Fountains + ducks' };
  const startLevelEl = document.getElementById('startLevel'), levelSelectEl = document.getElementById('levelSelect');
  for (let lv = 1; lv <= LAST_LEVEL; lv++) {
    const label = 'Level ' + lv + (LEVEL_NAMES[lv] ? ' · ' + LEVEL_NAMES[lv] : '');
    startLevelEl.add(new Option(label, String(lv)));
    levelSelectEl.add(new Option(label, String(lv)));
  }
  levelSelectEl.addEventListener('change', () => {
    const v = parseInt(levelSelectEl.value, 10);
    levelSelectEl.blur();
    if (!startCard.hidden) {           // still on the start screen: just preselect it
      startLevelEl.value = String(v);
      document.getElementById('levelChip').textContent = 'Level ' + v;
      return;
    }
    level = v; base = null; start();
  });
  startLevelEl.addEventListener('change', () => {
    levelSelectEl.value = startLevelEl.value;
    document.getElementById('levelChip').textContent = 'Level ' + startLevelEl.value;
  });

  document.getElementById('startBtn').addEventListener('click', async () => {
    level = parseInt(startLevelEl.value, 10) || 1;
    const ok = await enableTilt();
    if (!ok) useDragMode();
    else setTimeout(() => { if (!gotOrientation) useDragMode(); }, 1200);
    start();
  });
  document.getElementById('againBtn').addEventListener('click', () => {
    level = level < LAST_LEVEL ? level + 1 : 1;
    base = null; start();
  });

  function bounceOff(b, nx, ny, minD, px, py) {
    // push the ball out to distance minD from point (px,py) along normal (nx,ny), and bounce
    b.x = px + nx * minD; b.y = py + ny * minD;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      b.vx -= 1.4 * vn * nx; b.vy -= 1.4 * vn * ny;
      if (vn < -90) ripple(b.x - nx * b.r, b.y - ny * b.r, b.r * 2.4, 0.8, 0.55);
    }
  }
  function collideRing(b, dPrev) {
    const Rr = ringR();
    const dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy) || 0.001;
    let rel = Math.atan2(dy, dx) - ring.a;
    rel = Math.atan2(Math.sin(rel), Math.cos(rel));
    if (Math.abs(rel) > ring.gap / 2 && Math.abs(d - Rr) < b.r + ring.th) {
      const nx = dx / d, ny = dy / d;
      if (dPrev >= Rr) bounceOff(b, nx, ny, Rr + b.r + ring.th, CX, CY);
      else bounceOff(b, -nx, -ny, -(Rr - b.r - ring.th), CX, CY);
    }
    // the two buoys at the ends of the gap
    for (const s of [-1, 1]) {
      const ea = ring.a + s * ring.gap / 2;
      const ex = CX + Math.cos(ea) * Rr, ey = CY + Math.sin(ea) * Rr;
      const ddx = b.x - ex, ddy = b.y - ey, dd = Math.hypot(ddx, ddy) || 0.001;
      const min = b.r + ring.cap;
      if (dd < min) bounceOff(b, ddx / dd, ddy / dd, min, ex, ey);
    }
  }

  // ---------- physics ----------
  function step(dt) {
    readTilt();
    ft += dt;
    if (ROPE[level]) ring.a += ring.speed * dt;
    if (DUCK_COUNT[level]) stepDucks(dt);
    const b = ball; if (!b) return;
    if (state === 'dropping') {
      b.z -= dt / 0.65;
      if (b.z <= 0) {
        b.z = 0; state = 'playing'; t0 = performance.now();
        ripple(b.x, b.y, b.r * 5, 1.4, 0.9); ripple(b.x, b.y, b.r * 3, 1.0, 0.7);
        ripple(b.x, b.y, b.r * 7.5, 2.0, 0.5);
      }
      return;
    }
    if (state === 'playing') {
      elapsed = (performance.now() - t0) / 1000;
      const g = 1100; // px/s² at full tilt
      let ax = Math.sin(tilt.x * Math.PI / 180) * g;
      let ay = Math.sin(tilt.y * Math.PI / 180) * g;
      // whirlpool currents
      const dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy) || 0.001;
      if (d < R * 1.15) {
        const k = 1 - d / (R * 1.15);
        const nx = dx / d, ny = dy / d;
        const swirl = 260 * k;              // counter-clockwise current
        const pull = 170 * k * k + 40 * k;  // gentle drain pull
        ax += -ny * swirl - nx * pull;
        ay += nx * swirl - ny * pull;
        b.spin += k * dt * 6;
      }
      // fountains shove the ball away from their jets while they're spraying
      for (const f of fountains) {
        const pw = fountainPower(f); if (!pw) continue;
        const q = fountainPos(f), fx = b.x - q.x, fy = b.y - q.y, fd = Math.hypot(fx, fy) || 0.001;
        if (fd < q.reach) {
          // the spray rolls outward from the drain, so neighbouring fountains add up into a wall instead of cancelling out
          const push = 3400 * pw * (1 - fd / q.reach);
          const ox = (b.x - CX) / (d || 1), oy = (b.y - CY) / (d || 1);
          ax += (ox * 0.75 + fx / fd * 0.25) * push; ay += (oy * 0.75 + fy / fd * 0.25) * push;
        }
      }
      const drag = Math.exp(-1.6 * dt);
      b.vx = (b.vx + ax * dt) * drag;
      b.vy = (b.vy + ay * dt) * drag;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.spin += (b.vx * 0.6 - b.vy * 0.2) * dt / b.r * 0.25;
      // walls
      const L = pool.x + b.r, Rt = pool.x + pool.w - b.r, T = pool.y + b.r, B = pool.y + pool.h - b.r;
      if (b.x < L) { if (b.vx < -120) ripple(L - b.r, b.y, b.r * 2.5, 0.8, 0.6); b.x = L; b.vx = -b.vx * 0.45; }
      if (b.x > Rt) { if (b.vx > 120) ripple(Rt + b.r, b.y, b.r * 2.5, 0.8, 0.6); b.x = Rt; b.vx = -b.vx * 0.45; }
      if (b.y < T) { if (b.vy < -120) ripple(b.x, T - b.r, b.r * 2.5, 0.8, 0.6); b.y = T; b.vy = -b.vy * 0.45; }
      if (b.y > B) { if (b.vy > 120) ripple(b.x, B + b.r, b.r * 2.5, 0.8, 0.6); b.y = B; b.vy = -b.vy * 0.45; }
      if (ROPE[level]) collideRing(b, d);
      if (pilings.length) collidePilings(b);
      if (DUCK_COUNT[level]) for (const k of ducks) {
        const hit = collide(b, 1, k, DUCK_MASS, 0.75);
        if (hit > 90) ripple((b.x + k.x) / 2, (b.y + k.y) / 2, b.r * 2.6, 0.8, Math.min(0.7, hit / 400));
      }
      // wake
      const sp = Math.hypot(b.vx, b.vy);
      b.wake = (b.wake || 0) + sp * dt;
      if (b.wake > b.r * 2.2) { b.wake = 0; ripple(b.x, b.y, b.r * 2.6, 1.1, Math.min(0.45, sp / 500)); }
      // captured?
      if (d < HOLE * 0.85) {
        state = 'sinking'; b.sa = Math.atan2(dy, dx); b.sr = d; b.sink = 0;
        ripple(CX, CY, HOLE * 3, 1.2, 0.7);
      }
    } else if (state === 'sinking') {
      b.sink += dt / 1.3;
      b.sa += dt * (5 + b.sink * 10);
      b.sr = Math.max(0, b.sr * (1 - dt * 3));
      b.x = CX + Math.cos(b.sa) * b.sr; b.y = CY + Math.sin(b.sa) * b.sr;
      b.spin += dt * 12;
      if (b.sink >= 1) { state = 'won'; showWin(); }
    }
  }

  function showWin() {
    const t = elapsed, best = bests[level];
    document.getElementById('winTime').textContent = t.toFixed(1) + ' s';
    let line;
    if (best == null || t < best) {
      line = best == null ? 'First drain. Can you beat it?' : 'New best! Old best was ' + best.toFixed(1) + ' s';
      bests[level] = t;
      try { localStorage.setItem(BEST_KEYS[level], String(t)); } catch (_) {}
    } else line = 'Best: ' + best.toFixed(1) + ' s';
    document.getElementById('bestLine').textContent = line;
    document.getElementById('winTitle').textContent = level === 1 ? 'Down the drain!' : 'Level ' + level + ' cleared!';
    document.getElementById('againBtn').textContent = level < LAST_LEVEL ? 'Go to Level ' + (level + 1) : 'Play again from Level 1';
    winCard.hidden = false;
    document.getElementById('againBtn').focus({ preventScroll: true });
  }

  // ---------- rendering ----------
  function renderWater(t) {
    const d = img.data;
    const twistAmt = 2.6, rd = R * 0.55;
    const SWIRL_T = 3.5, pa = (t / SWIRL_T) % 1;
    let i = 0;
    for (let ty = 0; ty < TH; ty++) {
      const wy = pool.y + ty * CELL + CELL / 2 - CY;
      for (let tx = 0; tx < TW; tx++) {
        const wx = pool.x + tx * CELL + CELL / 2 - CX;
        const r = Math.sqrt(wx * wx + wy * wy);
        const depth = Math.exp(-r / rd);
        // Two copies of the pattern, each swirled for a few seconds then reset, cross-faded so the
        // swirl keeps turning forever without winding itself up into tight rings.
        const spin = 1.4 * Math.exp(-r / R), base = twistAmt * depth * 3;
        let c = 0, sh = 0;
        for (let k = 0; k < 2; k++) {
          const ph = (pa + k * 0.5) % 1, wgt = 1 - Math.abs(2 * ph - 1);
          const tw = base + (ph - 0.5) * SWIRL_T * spin;
          const cs = Math.cos(tw), sn = Math.sin(tw);
          const u = wx * cs - wy * sn, v = wx * sn + wy * cs;
          const n = Math.sin(u * 0.042 + t * 0.9) + Math.sin(v * 0.047 - t * 0.7)
                  + Math.sin((u * 0.6 + v * 0.8) * 0.033 + t * 1.1)
                  + Math.sin((-u * 0.7 + v * 0.5) * 0.039 - t * 0.55);
          let ck = 1 - Math.abs(Math.sin(n * 1.25));
          ck = ck * ck; ck = ck * ck * ck;               // sharp caustic lines
          c += ck * wgt;
          sh += 0.06 * Math.sin(u * 0.012 + v * 0.01 + t * 0.4) * wgt;   // a soft shimmer band
        }
        const hi = c * (1 - depth * 0.85) * 0.75;
        const dd = Math.min(1, depth * 1.15);
        // light pool blue -> deeper teal toward the vortex
        let rC = 128 - 95 * dd, gC = 214 - 100 * dd, bC = 243 - 70 * dd;
        rC += 255 * sh; gC += 255 * sh; bC += 255 * sh;
        d[i]     = rC + (255 - rC) * hi;
        d[i + 1] = gC + (255 - gC) * hi;
        d[i + 2] = bC + (255 - bC) * hi;
        d[i + 3] = 255;
        i += 4;
      }
    }
    wctx.putImageData(img, 0, 0);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawDeck() {
    ctx.fillStyle = '#e9e4d8'; ctx.fillRect(0, 0, W, H);
    // coping stones
    ctx.strokeStyle = 'rgba(160,148,124,.25)'; ctx.lineWidth = 1;
    const step = 46;
    for (let x = step; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = step; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // mosaic tile band at the waterline
    const p = pool, band = 8;
    roundRect(p.x - band, p.y - band, p.w + band * 2, p.h + band * 2, p.r + band);
    ctx.fillStyle = '#2e86b5'; ctx.fill();
    ctx.save(); ctx.clip();
    const ts = 8;
    for (let y = p.y - band; y < p.y + p.h + band; y += ts)
      for (let x = p.x - band; x < p.x + p.w + band; x += ts) {
        const h = ((x * 7 + y * 13) / ts) % 3;
        ctx.fillStyle = h < 1 ? '#3a9acb' : h < 2 ? '#2a7fae' : '#56b4dd';
        ctx.fillRect(x + 0.6, y + 0.6, ts - 1.2, ts - 1.2);
      }
    ctx.restore();
  }

  function drawVortex(t) {
    // spiral foam arms
    const arms = 5;
    ctx.save();
    ctx.lineCap = 'round';
    for (let a = 0; a < arms; a++) {
      const off = a * Math.PI * 2 / arms;
      let px = null, py = null;
      for (let s = 0; s <= 1; s += 0.02) {
        const r = HOLE * 0.9 + s * (R - HOLE * 0.9);
        const ang = off - Math.log(r / HOLE) * 1.9 - t * 1.6;
        const x = CX + Math.cos(ang) * r, y = CY + Math.sin(ang) * r;
        if (px != null) {
          const alpha = (1 - s) * 0.55 * Math.min(1, s * 6);
          ctx.strokeStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
          ctx.lineWidth = 1 + (1 - s) * 3.2;
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
        }
        px = x; py = y;
      }
    }
    ctx.restore();
    // the drain hole
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, HOLE * 2.4);
    g.addColorStop(0, 'rgba(4,22,40,1)');
    g.addColorStop(0.32, 'rgba(8,40,66,.95)');
    g.addColorStop(0.55, 'rgba(18,80,120,.55)');
    g.addColorStop(1, 'rgba(30,110,160,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CX, CY, HOLE * 2.4, 0, Math.PI * 2); ctx.fill();
    // foamy lip spinning at the rim
    ctx.save(); ctx.translate(CX, CY); ctx.rotate(-t * 3);
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.25 + 0.25 * Math.sin(i * 2.3 + t * 4)).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, HOLE * 0.95, a, a + 0.22); ctx.stroke();
    }
    ctx.restore();
  }

  function drawRipples(dt) {
    ctx.save();
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i]; r.age += dt;
      const k = r.age / r.life;
      if (k >= 1) { ripples.splice(i, 1); continue; }
      const rad = r.max * (0.15 + 0.85 * Math.sqrt(k));
      ctx.strokeStyle = 'rgba(255,255,255,' + (r.alpha * (1 - k)).toFixed(3) + ')';
      ctx.lineWidth = 2 * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function drawDucks(t) {
    for (const k of ducks) {
      const r = k.r * (1 + 0.03 * Math.sin(t * 2.6 + k.bobP));
      ctx.save();
      ctx.translate(k.x, k.y);
      // shadow
      ctx.fillStyle = 'rgba(13,59,92,.22)';
      ctx.beginPath(); ctx.ellipse(3, 5, r * 1.05, r * 0.85, k.dir, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(k.dir + Math.sin(t * 2 + k.bobP) * 0.06);
      // body seen from above; head points along +x
      const body = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r * 1.1);
      body.addColorStop(0, '#fff3a0'); body.addColorStop(0.55, '#ffd43b'); body.addColorStop(1, '#e8a90c');
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.ellipse(-r * 0.12, 0, r, r * 0.78, 0, 0, Math.PI * 2); ctx.fill();
      // tail
      ctx.beginPath(); ctx.moveTo(-r * 1.0, -r * 0.18); ctx.lineTo(-r * 1.32, 0); ctx.lineTo(-r * 1.0, r * 0.18); ctx.closePath(); ctx.fill();
      // wing
      ctx.strokeStyle = 'rgba(200,140,10,.6)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(-r * 0.25, 0, r * 0.5, r * 0.36, 0, -Math.PI * 0.6, Math.PI * 0.6); ctx.stroke();
      // head
      const hx = r * 0.62;
      const head = ctx.createRadialGradient(hx - r * 0.12, -r * 0.14, r * 0.05, hx, 0, r * 0.5);
      head.addColorStop(0, '#fff6b8'); head.addColorStop(1, '#f5bf1c');
      ctx.fillStyle = head;
      ctx.beginPath(); ctx.arc(hx, 0, r * 0.47, 0, Math.PI * 2); ctx.fill();
      // beak
      ctx.fillStyle = '#ff8a2a';
      ctx.beginPath(); ctx.ellipse(hx + r * 0.5, 0, r * 0.24, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
      // eyes
      ctx.fillStyle = '#1b1b1b';
      ctx.beginPath(); ctx.arc(hx + r * 0.16, -r * 0.24, r * 0.075, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx + r * 0.16, r * 0.24, r * 0.075, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawFountains(t) {
    for (const f of fountains) {
      const { x, y, reach } = fountainPos(f), pw = fountainPower(f);
      ctx.save();
      // nozzle grate on the pool floor
      ctx.fillStyle = 'rgba(13,59,92,.35)';
      ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
      if (pw < 0.05) {
        // resting: a few lazy bubbles so you can see where it is
        for (let i = 0; i < 3; i++) {
          const c = (t * 0.7 + i / 3 + f.seed) % 1;
          ctx.fillStyle = 'rgba(255,255,255,' + (0.6 * (1 - c)).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(x + Math.sin(i * 2.1 + f.seed) * 6 * c, y - c * 8, 1.5 + c * 1.5, 0, Math.PI * 2); ctx.fill();
        }
      } else {
        // spraying: churned foam, rings rolling outward, and droplets landing around the jet
        const foam = ctx.createRadialGradient(x, y, 0, x, y, reach * 0.75);
        foam.addColorStop(0, 'rgba(255,255,255,' + (0.85 * pw).toFixed(3) + ')');
        foam.addColorStop(0.45, 'rgba(255,255,255,' + (0.4 * pw).toFixed(3) + ')');
        foam.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = foam;
        ctx.beginPath(); ctx.arc(x, y, reach * 0.75, 0, Math.PI * 2); ctx.fill();
        for (let i = 0; i < 3; i++) {
          const c = (t * 1.6 + i / 3) % 1;
          ctx.strokeStyle = 'rgba(255,255,255,' + (0.7 * pw * (1 - c)).toFixed(3) + ')';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x, y, reach * (0.2 + 0.8 * c) * (0.6 + 0.4 * pw), 0, Math.PI * 2); ctx.stroke();
        }
        for (let i = 0; i < 18; i++) {
          const a = i * 2.399 + f.seed, c = (t * 1.3 + i * 0.37 + f.seed) % 1;
          const dr = reach * (0.15 + 0.85 * c) * pw;
          ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * (1 - c) * pw).toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(x + Math.cos(a) * dr, y + Math.sin(a) * dr, 1.2 + (1 - c) * 1.8, 0, Math.PI * 2); ctx.fill();
        }
        // the jet itself, seen from above
        ctx.fillStyle = 'rgba(255,255,255,' + (0.95 * pw).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(x, y, 5 + 4 * pw + Math.sin(t * 20 + f.seed) * 0.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawPilings(t) {
    for (const pl of pilings) {
      const { x, y, r } = pilingPos(pl);
      ctx.save();
      // foam where the current wraps around the post, trailing downstream (the current runs clockwise)
      const flow = pl.a + Math.PI / 2;
      ctx.lineCap = 'round';
      for (let j = 0; j < 3; j++) {
        const ph = ((t * 0.9 + j / 3 + pl.seed) % 1);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - ph)).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, r + 3 + ph * r * 0.9, flow - Math.PI / 2 - 0.6, flow - Math.PI / 2 + 0.6); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, r + 3 + ph * r * 0.9, flow + Math.PI / 2 - 0.6, flow + Math.PI / 2 + 0.6); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, r + 2, 0, Math.PI * 2); ctx.stroke();
      // shadow
      ctx.fillStyle = 'rgba(13,59,92,.3)';
      ctx.beginPath(); ctx.arc(x + 4, y + 6, r, 0, Math.PI * 2); ctx.fill();
      // bark edge, then the sawn top with growth rings
      ctx.fillStyle = '#5b3a22';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      const top = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r * 0.88);
      top.addColorStop(0, '#e2bd8a'); top.addColorStop(1, '#b98a57');
      ctx.fillStyle = top;
      ctx.beginPath(); ctx.arc(x, y, r * 0.84, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(110,70,35,.45)'; ctx.lineWidth = 1;
      for (let k = 1; k <= 3; k++) {
        ctx.beginPath(); ctx.ellipse(x + 1, y, r * 0.2 * k, r * 0.19 * k, pl.seed, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(110,70,35,.6)';
      ctx.beginPath(); ctx.arc(x + 1, y, r * 0.07, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawRing(t) {
    const Rr = ringR(), span = Math.PI * 2 - ring.gap;
    const a0 = ring.a + ring.gap / 2, a1 = a0 + span;
    // shadow + cable under the floats
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(13,59,92,.22)'; ctx.lineWidth = ring.th * 2.4;
    ctx.beginPath(); ctx.arc(CX + 3, CY + 5, Rr, a0, a1); ctx.stroke();
    ctx.strokeStyle = 'rgba(13,59,92,.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(CX, CY, Rr, a0, a1); ctx.stroke();
    // red and white floats
    const n = Math.max(12, Math.floor(span * Rr / 9.5));
    for (let i = 1; i < n; i++) {
      const a = a0 + span * i / n;
      const bob = Math.sin(t * 2.4 + i * 0.9) * 0.5;
      const x = CX + Math.cos(a) * (Rr + bob), y = CY + Math.sin(a) * (Rr + bob);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      ctx.fillStyle = Math.floor(i / 3) % 2 ? '#ffffff' : '#e8463a';
      ctx.beginPath(); ctx.ellipse(0, 0, ring.th + 0.6, ring.th * 1.05, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(-1.4, -1.4, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // yellow buoys marking the gap
    for (const s of [-1, 1]) {
      const a = ring.a + s * ring.gap / 2;
      const x = CX + Math.cos(a) * Rr, y = CY + Math.sin(a) * Rr;
      ctx.fillStyle = 'rgba(13,59,92,.25)';
      ctx.beginPath(); ctx.arc(x + 2, y + 3, ring.cap, 0, Math.PI * 2); ctx.fill();
      const g = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, ring.cap);
      g.addColorStop(0, '#fff6c2'); g.addColorStop(0.5, '#ffc93c'); g.addColorStop(1, '#e09a12');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, ring.cap, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  const WEDGES =['#ff6b4a', '#ffffff', '#ffc93c', '#ffffff', '#2fb5a3', '#ffffff'];
  function drawBall(t) {
    const b = ball; if (!b) return;
    const bob = state === 'playing' ? 1 + 0.03 * Math.sin(t * 3.2) : 1;
    let scale = (1 + b.z * 1.3) * bob, alpha = 1;
    if (state === 'sinking' || state === 'won') { const s = Math.min(1, b.sink); scale *= 1 - s * 0.85; alpha = 1 - s * 0.9; }
    const r = b.r * scale;
    // shadow on the water
    const so = 4 + b.z * 26;
    ctx.save();
    ctx.globalAlpha = (0.28 - b.z * 0.12) * alpha;
    ctx.fillStyle = '#0d3b5c';
    ctx.beginPath(); ctx.ellipse(b.x + so * 0.6, b.y + so, b.r * (1 + b.z * 0.4), b.r * 0.8 * (1 + b.z * 0.4), 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const by = b.y - b.z * 60;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(b.x, by);
    ctx.save();
    ctx.rotate(b.spin);
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = WEDGES[i];
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, i * Math.PI / 3, (i + 1) * Math.PI / 3); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // shading + gloss
    const sg = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    sg.addColorStop(0, 'rgba(255,255,255,.55)');
    sg.addColorStop(0.45, 'rgba(255,255,255,0)');
    sg.addColorStop(1, 'rgba(13,59,92,.35)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // waterline ring around a floating ball
    if (b.z === 0 && state === 'playing') {
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, r * 1.12, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // ---------- loop ----------
  let last = performance.now(), wt = 0;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    wt += reduceMotion ? dt * 0.3 : dt;
    step(dt);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawDeck();
    ctx.save();
    roundRect(pool.x, pool.y, pool.w, pool.h, pool.r); ctx.clip();
    renderWater(wt);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(wtex, pool.x, pool.y, TW * CELL, TH * CELL);
    // inner edge shade
    ctx.strokeStyle = 'rgba(13,59,92,.25)'; ctx.lineWidth = 10;
    roundRect(pool.x, pool.y, pool.w, pool.h, pool.r); ctx.stroke();
    drawVortex(wt);
    drawRipples(dt);
    if (ROPE[level]) drawRing(wt);
    if (DUCK_COUNT[level]) drawDucks(wt);
    if (pilings.length) drawPilings(wt);
    if (fountains.length) drawFountains(wt);
    if (ball && state !== 'dropping') drawBall(wt);
    ctx.restore();
    if (ball && state === 'dropping') drawBall(wt); // still in the air, above the clip
    timerEl.textContent = (state === 'playing' ? (performance.now() - t0) / 1000 : elapsed).toFixed(1) + ' s';
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
